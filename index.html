<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khoá Học Mall - Tiếng Anh Giao Tiếp</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0066cc;
            --primary-dark: #004c99;
            --accent-light: #e6f2ff;
            --bg-page: #f0f2f5;
            --text-dark: #1c1e21;
            --sidebar-width: 380px;
            --header-height: 60px;
            --success-color: #28a745;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html { scroll-behavior: smooth; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #b0c4de; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #0066cc; }

        body {
            background-color: var(--bg-page);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER */
        header {
            background-color: var(--primary-color);
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            justify-content: space-between;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .logo i { font-size: 24px; }

        /* NÚT MỞ KHÓA */
        .btn-unlock {
            background: linear-gradient(135deg, #FFD700 0%, #FF8C00 100%);
            color: #fff;
            padding: 8px 16px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
            border: 1px solid rgba(255,255,255,0.3);
            white-space: nowrap;
        }

        .btn-unlock:active { transform: scale(0.95); }
        .btn-unlock:hover { transform: scale(1.05); }

        .btn-unlock::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 3s infinite;
        }
        @keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }

        /* LAYOUT CONTAINER */
        .container {
            display: flex;
            flex-direction: row;
            margin-top: var(--header-height);
            height: calc(100vh - var(--header-height));
            overflow: hidden;
        }

        /* 1. LEFT: MAIN CONTENT */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-wrapper {
            width: 100%;
            max-width: 1000px;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        .lesson-info {
            width: 100%;
            max-width: 1000px;
            margin-top: 20px;
        }

        .lesson-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .lesson-meta {
            color: #606060;
            font-size: 14px;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* ACTIONS & BUTTONS */
        .lesson-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
            white-space: nowrap;
        }
        .btn:active { transform: translateY(1px); }

        .btn-primary { 
            background-color: var(--primary-color); 
            color: white; 
            box-shadow: 0 2px 5px rgba(0, 102, 204, 0.2);
        }
        .btn-primary:hover { background-color: var(--primary-dark); }
        
        .btn-outline { 
            background: white; 
            color: var(--primary-color); 
            border: 1px solid var(--primary-color); 
        }
        .btn-outline:hover { background: var(--accent-light); }

        /* MATERIALS SECTION */
        .materials-section {
            width: 100%;
            max-width: 1000px;
            margin-top: 30px;
            margin-bottom: 30px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
        }

        .materials-header {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .materials-desc {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .btn-download {
            background-color: var(--success-color);
            color: white;
            width: 100%;
            max-width: 250px;
        }
        .btn-download:hover { background-color: #218838; }

        /* 2. RIGHT: SIDEBAR PLAYLIST */
        .sidebar {
            width: var(--sidebar-width);
            background: #fff;
            border-left: 1px solid #e0e0e0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100%;
        }

        .sidebar-header {
            padding: 15px 20px;
            border-bottom: 2px solid var(--primary-color);
            position: sticky; top: 0; 
            background: #f8faff;
            z-index: 10;
        }
        
        .playlist-info h3 { font-size: 16px; color: var(--primary-dark); margin-bottom: 2px; }
        .playlist-info span { font-size: 12px; color: #666; }

        .unit-group { border-bottom: 1px solid #eee; }

        .unit-title {
            padding: 12px 15px;
            background: #fff;
            cursor: pointer;
            font-weight: 600;
            color: #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            transition: background 0.2s;
        }
        .unit-title:hover { background: #f5f5f5; color: var(--primary-color); }
        .unit-group.active .unit-title i { transform: rotate(180deg); }

        .lesson-list { display: none; list-style: none; }
        .unit-group.active .lesson-list { display: block; }

        .lesson-item {
            display: flex;
            gap: 10px;
            padding: 12px 15px;
            cursor: pointer;
            transition: all 0.2s;
            align-items: flex-start;
            border-left: 3px solid transparent;
            border-bottom: 1px solid #f0f0f0;
        }

        .lesson-item:hover { background-color: #f0f8ff; }
        
        .lesson-item.active {
            background-color: var(--accent-light);
            border-left: 3px solid var(--primary-color);
        }
        
        .lesson-item.active .lesson-name {
            color: var(--primary-color);
            font-weight: 700;
        }
        
        .lesson-item.active .thumbnail-placeholder {
            background-color: var(--primary-color);
            color: white;
        }

        .thumbnail-placeholder {
            width: 70px;
            height: 40px;
            background: #e0e0e0;
            border-radius: 4px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 10px;
        }
        
        .lesson-name {
            font-size: 13px;
            font-weight: 500;
            color: #333;
            line-height: 1.3;
            margin-bottom: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .lesson-status { font-size: 11px; color: #888; }

        /* RESPONSIVE */
        @media (max-width: 991px) {
            body { height: auto; overflow: visible; }
            .container { flex-direction: column; height: auto; margin-top: var(--header-height); }
            .main-content { width: 100%; padding: 15px; order: 1; }
            .sidebar { width: 100%; height: auto; max-height: 500px; border-left: none; border-top: 1px solid #ddd; order: 2; }
            .lesson-title { font-size: 20px; }
        }

        @media (max-width: 600px) {
            header { padding: 0 15px; }
            .logo span { font-size: 15px; max-width: 180px; }
            .btn-unlock span { display: none; }
            .btn-unlock { padding: 8px; border-radius: 50%; }
            .main-content { padding: 10px; }
            .lesson-title { font-size: 18px; margin-top: 10px; }
            .lesson-actions .btn { flex: 1; padding: 12px; }
            .materials-section { padding: 15px; }
            .video-wrapper { margin: -10px -10px 0 -10px; width: calc(100% + 20px); max-width: none; }
            .video-container { border-radius: 0; }
        }
    </style>
</head>

        // --- HÀM XỬ LÝ LINK (Cập nhật hỗ trợ Docs) ---
        function getEmbedLink(url) {
            // 1. Xử lý link Facebook
            if (url.includes('facebook.com') || url.includes('fb.watch')) {
                let encodedUrl = encodeURIComponent(url);
                return `https://www.facebook.com/plugins/video.php?href=${encodedUrl}&show_text=0&t=0`;
            }

            // 2. Xử lý link Google Drive (Video)
            if (url.includes('drive.google.com')) {
                return url.replace('/view', '/preview').replace('?usp=drivesdk', '');
            }

            // 3. Xử lý link Google Docs (Word/Excel...) để xem trước thay vì sửa
            if (url.includes('docs.google.com')) {
                 // Chuyển /edit thành /preview để nhúng iframe đẹp hơn
                 return url.split('/edit')[0] + '/preview';
            }

            // 4. Các link khác trả về nguyên gốc
            return url;
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            const header = sidebar.querySelector('.sidebar-header');
            sidebar.innerHTML = '';
            sidebar.appendChild(header);

            courseData.forEach((unit, uIndex) => {
                const group = document.createElement('div');
                group.className = 'unit-group';
                if (uIndex === 0) group.classList.add('active'); 

                const title = document.createElement('div');
                title.className = 'unit-title';
                title.innerHTML = `<span>${unit.unit}</span> <i class="fas fa-chevron-down"></i>`;
                title.onclick = () => { group.classList.toggle('active'); };

                const list = document.createElement('ul');
                list.className = 'lesson-list';

                unit.lessons.forEach((lesson, lIndex) => {
                    const li = document.createElement('li');
                    li.className = 'lesson-item';
                    li.id = `lesson-${uIndex}-${lIndex}`;
                    li.dataset.uIndex = uIndex;
                    li.dataset.lIndex = lIndex;
                    
                    // Kiểm tra loại icon (video hoặc tài liệu)
                    let iconClass = "fa-play";
                    if(lesson.title.toLowerCase().includes('word') || lesson.title.toLowerCase().includes('sach')) {
                        iconClass = "fa-file-word";
                    }

                    li.innerHTML = `
                        <div class="thumbnail-placeholder"><i class="fas ${iconClass}"></i></div>
                        <div class="lesson-details">
                            <div class="lesson-name">${lesson.title}</div>
                            <div class="lesson-status">Bài ${lIndex + 1}</div>
                        </div>
                    `;
                    
                    li.onclick = (e) => {
                        e.stopPropagation();
                        loadLesson(uIndex, lIndex);
                    };
                    list.appendChild(li);
                });

                group.appendChild(title);
                group.appendChild(list);
                sidebar.appendChild(group);
            });
        }

        function loadLesson(uIndex, lIndex) {
            currentUnitIndex = uIndex;
            currentLessonIndex = lIndex;
            const lesson = courseData[uIndex].lessons[lIndex];
            
            document.getElementById('lessonTitle').innerText = lesson.title;
            document.getElementById('unitName').innerText = courseData[uIndex].unit;
            document.getElementById('videoPlayer').src = getEmbedLink(lesson.link);
            document.getElementById('driveLinkBtn').href = lesson.link;

            document.querySelectorAll('.lesson-item').forEach(item => item.classList.remove('active'));
            const activeItem = document.getElementById(`lesson-${uIndex}-${lIndex}`);
            
            if (activeItem) {
                activeItem.classList.add('active');
                if (window.innerWidth > 991) {
                    activeItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            if (window.innerWidth <= 991) {
                document.getElementById('mainContent').scrollIntoView({ behavior: 'smooth' });
            }
        }

        function nextLesson() {
            const currentUnit = courseData[currentUnitIndex];
            if (currentLessonIndex < currentUnit.lessons.length - 1) {
                loadLesson(currentUnitIndex, currentLessonIndex + 1);
            } else if (currentUnitIndex < courseData.length - 1) {
                const nextUnitIndex = currentUnitIndex + 1;
                const groups = document.querySelectorAll('.unit-group');
                groups.forEach(g => g.classList.remove('active'));
                groups[nextUnitIndex].classList.add('active');
                loadLesson(nextUnitIndex, 0);
            } else {
                alert("Bạn đã hoàn thành bài học cuối cùng!");
            }
        }

        function prevLesson() {
            if (currentLessonIndex > 0) {
                loadLesson(currentUnitIndex, currentLessonIndex - 1);
            } else if (currentUnitIndex > 0) {
                const prevUnitIndex = currentUnitIndex - 1;
                const lastLessonIndex = courseData[prevUnitIndex].lessons.length - 1;
                const groups = document.querySelectorAll('.unit-group');
                groups.forEach(g => g.classList.remove('active'));
                groups[prevUnitIndex].classList.add('active');
                loadLesson(prevUnitIndex, lastLessonIndex);
            }
        }

        window.onload = () => {
            renderSidebar();
            loadLesson(0, 0);
        };
    </script>
</body>
</html>
